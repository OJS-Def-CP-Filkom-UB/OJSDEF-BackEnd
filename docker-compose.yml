version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ojsdef-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ojsdef
      - POSTGRES_PASSWORD=ojsdef_password
      - POSTGRES_DB=ojsdef_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojsdef -d ojsdef_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ojsdef-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    container_name: ojsdef-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  api:
    build: .
    container_name: ojsdef-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_internal:
    build: .
    container_name: ojsdef-celery-internal
    command: celery -A app.worker.celery_app worker -Q internal_scan -c 4 --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db

  celery_external:
    build: .
    container_name: ojsdef-celery-external
    command: celery -A app.worker.celery_app worker -Q external_scan -c 2 --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db

  celery_scoring:
    build: .
    container_name: ojsdef-celery-scoring
    command: celery -A app.worker.celery_app worker -Q scoring -c 2 --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db
      
  celery_beat:
    build: .
    container_name: ojsdef-celery-beat
    command: celery -A app.worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_SERVER=db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  redis_data:
  minio_data:
